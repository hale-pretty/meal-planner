spring.application.name=meal-planner

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/meal_planner}
spring.datasource.username=meal_planner_app
spring.datasource.password=${APP_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.data-source-properties.connectTimeout=2
spring.datasource.hikari.data-source-properties.socketTimeout=2

spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.address=127.0.0.1
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
