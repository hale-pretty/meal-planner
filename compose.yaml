services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meal_planner}
      POSTGRES_USER: ${POSTGRES_USER:-meal_planner_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your ignored .env file}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in your ignored .env file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/database/10-create-app-user.sql:/docker-entrypoint-initdb.d/10-create-app-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  catalog_data:
